<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPay Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header div {
            flex: 1;
            text-align: center;
        }
        .transactions {
            border: 1px solid #000;
            padding: 10px;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }
        .transaction-item:last-child {
            border-bottom: none;
        }
        button {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="header">
        <div>No HP: <strong>{{ user_phone }}</strong></div>
        <div>Saldo: <strong>Rp {{ user_balance|floatformat:0 }}</strong></div>
        <div><a href="{% url 'transaction_view' %}" style="text-decoration: none;"><button>Lakukan Transaksi</button></a></div>
    </div>

    <!-- Transaction History Section -->
    <div class="transactions">
        <h3>Riwayat Transaksi</h3>
        {% for transaction in transactions %}
        <div class="transaction-item">
            <div>{{ transaction.0|floatformat:0 }}</div>
            <div>{{ transaction.1|date:"d F Y" }}</div>
            <div>{{ transaction.2 }}</div>
        </div>
        {% empty %}
        <p>Tidak ada riwayat transaksi.</p>
        {% endfor %}
    </div>
</body>
</html>
