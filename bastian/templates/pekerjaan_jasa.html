<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Orders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 15px;
            border: 1px solid black;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header div {
            display: flex;
            flex-direction: column;
        }

        .header p {
            margin: 5px 0;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            background-color: white;
            border: 1px solid black;
            padding: 15px;
            border-radius: 8px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: black;
        }

        select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 5px;
            font-size: 16px;
            background-color: white;
            color: black; /* Ensure text is black */
        }

        option {
            color: black; /* Ensure dropdown options text is black */
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background-color: black;
            color: white;
        }

        .order-card {
            border: 1px solid black;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .order-details {
            margin-bottom: 10px;
        }

        .order-details p {
            margin: 5px 0;
        }

        .action-button {
            display: inline-block;
            padding: 10px 15px;
            text-align: center;
            border: 1px solid black;
            cursor: pointer;
            background-color: white;
            border-radius: 5px;
        }

        .action-button:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Service Orders</h2>

        <!-- CSRF Token -->
        <input type="hidden" id="csrf_token" value="{{ csrf_token }}">

        <!-- Filter Section -->
        <div class="filter-container">
            <div>
                <label for="category">Kategori Jasa:</label>
                <select id="category" onchange="updateSubcategories()">
                    <option value="">-- Pilih Kategori --</option>
                    {% for category in categories %}
                    <option value="{{ category.0 }}">{{ category.1 }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="subcategory">Subkategori Jasa:</label>
                <select id="subcategory">
                    <option value="">-- Pilih Subkategori --</option>
                </select>
            </div>

            <button onclick="filterOrders()">Search</button>
        </div>

        <!-- Orders List -->
        <div id="orders-list">
            {% for order in orders %}
            <div class="order-card">
                <div class="order-details">
                    <p><strong>Subkategori Pesanan:</strong> {{ order.namasubkategori }}</p>
                    <p><strong>Nama Pelanggan:</strong> {{ order.nama }}</p>
                    <p><strong>Total Biaya:</strong> Rp {{ order.biaya }}</p>
                    <p><strong>Tanggal Pemesanan:</strong> {{ order.tglpemesanan }}</p>
                    <p><strong>Sesi:</strong> {{ order.sesi }}</p>
                </div>
                <button class="action-button" value="{{ order.id }}" onclick="kerjakanPesanan(this)">Kerjakan Pesanan</button>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // Update subcategories based on the selected category
        function updateSubcategories() {
            const category = document.getElementById("category").value;
            const subcategoryDropdown = document.getElementById("subcategory");
            subcategoryDropdown.innerHTML = '<option value="">-- Pilih Subkategori --</option>';

            if (category) {
                fetch(`/fetch_subcategories/?category_id=${category}`)
                    .then(response => response.json())
                    .then(data => {
                        data.subcategories.forEach(subcategory => {
                            const option = document.createElement("option");
                            option.value = subcategory[0];
                            option.textContent = subcategory[1];
                            subcategoryDropdown.appendChild(option);
                        });
                    })
                    .catch(error => console.error('Error fetching subcategories:', error));
            }
        }

        // Filter orders based on the selected category and subcategory
        function filterOrders() {
            const category = document.getElementById("category").value;
            const subcategory = document.getElementById("subcategory").value;

            fetch(`/fetch_orders/?subcategory_id=${subcategory}`)
                .then(response => response.json())
                .then(data => {
                    const ordersList = document.getElementById("orders-list");
                    ordersList.innerHTML = "";
                    data.orders.forEach(order => {
                        const orderCard = document.createElement("div");
                        orderCard.classList.add("order-card");
                        orderCard.innerHTML = `
                            <div class="order-details">
                                <p><strong>Subkategori Pesanan:</strong> ${order.namasubkategori}</p>
                                <p><strong>Nama Pelanggan:</strong> ${order.nama}</p>
                                <p><strong>Total Biaya:</strong> Rp ${order.biaya}</p>
                                <p><strong>Tanggal Pemesanan:</strong> ${order.tglpemesanan}</p>
                                <p><strong>Sesi:</strong> ${order.sesi}</p>
                            </div>
                            <button class="action-button" value="${order.id}" onclick="kerjakanPesanan(this)">Kerjakan Pesanan</button>
                        `;
                        ordersList.appendChild(orderCard);
                    });
                })
                .catch(error => console.error('Error fetching orders:', error));
        }

        // Function to mark the order as processed (Kerjakan Pesanan)
        function kerjakanPesanan(buttonElement) {
            const orderId = buttonElement.value; // Get the order ID from the value attribute
            if (!orderId) {
                console.error('Order ID is missing');
                return;
            }

            // Get the CSRF token from the hidden input field
            const csrfToken = document.getElementById('csrf_token').value;

            // Change the fetch method to POST and send data as URL-encoded
            fetch(`/change_status/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',  // Form data type
                    'X-CSRFToken': csrfToken,  // Add the CSRF token here
                },
                body: `id_tpj=${orderId}`,  // Send data in the body of the POST request
            })
            .then(response => response.json())
            .then(data => {
                filterOrders(); // Re-fetch and update orders list after status change
            })
            .catch(error => console.error('Error changing status:', error));
        }
    </script>
</body>
</html>
