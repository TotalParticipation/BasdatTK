{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10">
    <div class="bg-white shadow-md rounded p-6">
        <div class="flex flex-wrap mb-4">
            <!-- Dropdown -->
            <select id="categoryDropdown" class="mr-4 p-2 border border-gray-300 rounded">
                <option value="">Kategori</option>
                <option value="kategori1">Kategori Jasa 1</option>
                <option value="kategori2">Kategori Jasa 2</option>
                <option value="kategori3">Kategori Jasa 3</option>
            </select>

            <!-- Search Bar -->
            <input type="text" id="subcategorySearch" class="flex-grow p-2 border border-gray-300 rounded" placeholder="Nama Subkategori">

            <!-- Search Button -->
            <button id="searchButton" class="ml-4 bg-blue-500 text-white px-4 py-2 rounded">Search</button>
        </div>

        <!-- Categories and Subcategories -->
        <div id="subcategoryList">
            <div class="border-t border-gray-200 mt-4">
                <p class="font-bold py-2">Kategori Jasa 1</p>
                <div class="pl-4">
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 1</div>
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 2</div>
                </div>
            </div>
            <div class="border-t border-gray-200 mt-4">
                <p class="font-bold py-2">Kategori Jasa 2</p>
                <div class="pl-4">
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 1</div>
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 2</div>
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 3</div>
                </div>
            </div>
            <div class="border-t border-gray-200 mt-4">
                <p class="font-bold py-2">Kategori Jasa 3</p>
                <div class="pl-4">
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 1</div>
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 2</div>
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">Subkategori Jasa 3</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
