{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10">
    <div class="bg-white shadow-md rounded p-6">
        <div class="flex flex-wrap mb-4">
            <!-- Dropdown -->
            <select id="categoryDropdown" class="mr-4 p-2 border border-gray-300 rounded">
                <option value="">Kategori</option>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>

            <!-- Search Bar -->
            <input type="text" id="subcategorySearch" class="flex-grow p-2 border border-gray-300 rounded" placeholder="Nama Subkategori">

            <!-- Search Button -->
            <button id="searchButton" class="ml-4 bg-blue-500 text-white px-4 py-2 rounded">Search</button>
        </div>

        <!-- Categories and Subcategories -->
        <div id="subcategoryList">
            {% for category in categories %}
            <div class="border-t border-gray-200 mt-4">
                <p class="font-bold py-2">{{ category.name }}</p>
                <div class="pl-4">
                    {% for subcategory in category.subcategories %}
                    <div class="py-2 border-b border-gray-200 cursor-pointer hover:bg-gray-100">
                        {{ subcategory.name }}
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const categoryDropdown = document.getElementById("categoryDropdown");
    const subcategoryList = document.getElementById("subcategoryList");
    const searchButton = document.getElementById("searchButton");
    const subcategorySearch = document.getElementById("subcategorySearch");

    // Fetch categories and subcategories
    fetch("/homepage/categories/")
      .then((response) => response.json())
      .then((data) => {
        if (data.error) {
          console.error(data.error);
          return;
        }
        populateCategories(data.categories);
      })
      .catch((err) => console.error(err));

    function populateCategories(categories) {
      // Populate dropdown
      for (const [id, category] of Object.entries(categories)) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = category.name;
        categoryDropdown.appendChild(option);
      }

      // Populate subcategories
      renderSubcategories(categories);
    }

    function renderSubcategories(categories) {
      subcategoryList.innerHTML = "";
      for (const [id, category] of Object.entries(categories)) {
        const categoryDiv = document.createElement("div");
        categoryDiv.classList.add("border-t", "border-gray-200", "mt-4");

        const categoryTitle = document.createElement("p");
        categoryTitle.classList.add("font-bold", "py-2");
        categoryTitle.textContent = category.name;
        categoryDiv.appendChild(categoryTitle);

        const subcategoryContainer = document.createElement("div");
        subcategoryContainer.classList.add("pl-4");

        category.subcategories.forEach((sub) => {
          const subDiv = document.createElement("div");
          subDiv.classList.add(
            "py-2",
            "border-b",
            "border-gray-200",
            "cursor-pointer",
            "hover:bg-gray-100"
          );
          subDiv.textContent = sub.name;
          subcategoryContainer.appendChild(subDiv);
        });

        categoryDiv.appendChild(subcategoryContainer);
        subcategoryList.appendChild(categoryDiv);
      }
    }

    // Handle Search
    searchButton.addEventListener("click", function () {
      const query = subcategorySearch.value.toLowerCase();
      const categoryId = categoryDropdown.value;
      fetch(`/homepage/categories/`)
        .then((response) => response.json())
        .then((data) => {
          if (data.error) {
            console.error(data.error);
            return;
          }
          const filteredCategories = filterCategories(
            data.categories,
            categoryId,
            query
          );
          renderSubcategories(filteredCategories);
        })
        .catch((err) => console.error(err));
    });

    function filterCategories(categories, categoryId, query) {
      const filtered = {};
      for (const [id, category] of Object.entries(categories)) {
        if (categoryId && id !== categoryId) continue;

        const matchingSubcategories = category.subcategories.filter((sub) =>
          sub.name.toLowerCase().includes(query)
        );

        if (matchingSubcategories.length > 0 || !query) {
          filtered[id] = {
            name: category.name,
            subcategories: matchingSubcategories,
          };
        }
      }
      return filtered;
    }
  });
</script>

{% endblock %}
